name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Jest E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        id: jest
        run: npm test
        continue-on-error: true

      # Upload the HTML report even when tests fail, so a broken suite is
      # visible on the published page instead of freezing on the last green run.
      - name: Upload test report artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: report

      - name: Fail job if tests failed
        if: steps.jest.outcome == 'failure'
        run: exit 1

  publish-report:
    name: Publish Test Report to GitHub Pages
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
