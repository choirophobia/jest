name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Jest E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # allure-commandline (used below to turn allure-results/ into the
      # published report) wraps a Java application — pinned explicitly
      # rather than relying on whatever JDK a given runner image happens to
      # ship with by default. See Understanding the Allure Report.
      - name: Setup Java (required by Allure's report generator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # Fails fast, with one clear message, instead of burning through this
      # suite's 200+ requests only to produce a wall of confusing 429s if
      # DummyJSON is already down or its rate-limit budget is already low
      # (e.g. right after heavy local testing from a shared IP, or another
      # CI run that just used the same runner). See Understanding the CI
      # Health Pre-check.
      - name: Check DummyJSON health before running the suite
        id: health
        run: |
          RESPONSE=$(curl -s -D - -o /dev/null -w "\nHTTP_STATUS:%{http_code}" https://dummyjson.com/test)
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          REMAINING=$(echo "$RESPONSE" | grep -i "^x-ratelimit-remaining:" | tr -d '\r' | cut -d: -f2 | tr -d ' ')

          if [ "$STATUS" != "200" ]; then
            echo "::error::DummyJSON is unreachable (GET /test returned HTTP $STATUS) — aborting before running ~200+ requests against a service that's currently down."
            exit 1
          fi

          echo "DummyJSON is reachable. Rate-limit remaining: ${REMAINING:-unknown}/100"

          if [ -n "$REMAINING" ] && [ "$REMAINING" -lt 20 ]; then
            echo "::warning::DummyJSON's rate-limit budget is already low ($REMAINING/100 remaining) before this run has even started. Expect possible 429s during this run — helpers/apiClient.js's retry/backoff layer will absorb short bursts, but a low starting budget makes a sustained shortfall more likely."
          fi

      - name: Run Jest tests
        id: jest
        if: steps.health.outcome == 'success'
        run: npm test
        continue-on-error: true

      # Builds the published report from allure-results/ (produced by the
      # allure-jest test environment in jest.config.js) even when tests
      # failed, so a broken suite is visible on the published page instead
      # of freezing on the last green run.
      - name: Generate Allure report
        if: always() && steps.health.outcome == 'success'
        run: npm run report:allure:generate

      - name: Upload test report artifact
        if: always() && steps.health.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Fail job if tests failed
        if: steps.jest.outcome == 'failure'
        run: exit 1

  publish-report:
    name: Publish Test Report to GitHub Pages
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
