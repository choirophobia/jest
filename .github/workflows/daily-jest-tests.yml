name: Daily Jest E2E Suite (DummyJSON)

on:
  schedule:
    # 06:00 WIB (UTC+7) daily = 23:00 UTC the previous day
    - cron: '0 23 * * *'
  workflow_dispatch: {}

jobs:
  jest-tests:
    name: Jest E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails fast, with one clear message, instead of burning through this
      # suite's 200+ requests only to produce a wall of confusing 429s if
      # DummyJSON is already down or its rate-limit budget is already low.
      # See Understanding the CI Health Pre-check.
      - name: Check DummyJSON health before running the suite
        id: health
        run: |
          RESPONSE=$(curl -s -D - -o /dev/null -w "\nHTTP_STATUS:%{http_code}" https://dummyjson.com/test)
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          REMAINING=$(echo "$RESPONSE" | grep -i "^x-ratelimit-remaining:" | tr -d '\r' | cut -d: -f2 | tr -d ' ')

          if [ "$STATUS" != "200" ]; then
            echo "::error::DummyJSON is unreachable (GET /test returned HTTP $STATUS) — aborting before running ~200+ requests against a service that's currently down."
            exit 1
          fi

          echo "DummyJSON is reachable. Rate-limit remaining: ${REMAINING:-unknown}/100"

          if [ -n "$REMAINING" ] && [ "$REMAINING" -lt 20 ]; then
            echo "::warning::DummyJSON's rate-limit budget is already low ($REMAINING/100 remaining) before this run has even started. Expect possible 429s during this run — helpers/apiClient.js's retry/backoff layer will absorb short bursts, but a low starting budget makes a sustained shortfall more likely."
          fi

      - name: Run Jest tests
        id: jest
        if: steps.health.outcome == 'success'
        run: npx jest --json --outputFile=jest-results.json
        continue-on-error: true

      - name: Parse Jest results
        id: parse
        if: steps.health.outcome == 'success'
        run: |
          echo "passed=$(jq '.numPassedTests' jest-results.json)" >> "$GITHUB_OUTPUT"
          echo "failed=$(jq '.numFailedTests' jest-results.json)" >> "$GITHUB_OUTPUT"
          echo "total=$(jq '.numTotalTests' jest-results.json)" >> "$GITHUB_OUTPUT"
          echo "success=$(jq '.success' jest-results.json)" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: always() && steps.health.outcome == 'success'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set — skipping Discord notification. Test results above are unaffected."
            exit 0
          fi

          if [ "${{ steps.parse.outputs.success }}" = "true" ]; then
            STATUS="PASSED ✅"
            COLOR=3066993
          else
            STATUS="FAILED ❌"
            COLOR=15158332
          fi

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg passed "${{ steps.parse.outputs.passed }}" \
            --arg failed "${{ steps.parse.outputs.failed }}" \
            --arg total "${{ steps.parse.outputs.total }}" \
            --arg url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: ("[Jest] DummyJSON E2E Suite — " + $status),
                description: ("**Source:** Jest (`tests/*.test.js`)\n**Passed:** " + $passed + "\n**Failed:** " + $failed + "\n**Total:** " + $total),
                url: $url,
                color: $color
              }]
            }')

          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Fail job if tests failed
        if: steps.parse.outputs.success != 'true'
        run: exit 1
